// ST. BRIELLE development input defaults.
// Loaded after settings.cfg so the standalone greybox always has a known
// playable control scheme even when an older Skin Deep/user config exists.

unbind "w"
unbind "s"
unbind "a"
unbind "d"
unbind "SPACE"
unbind "CTRL"
unbind "SHIFT"
unbind "e"

bind "w" "_forward"
bind "s" "_back"
bind "a" "_moveLeft"
bind "d" "_moveRight"
bind "UPARROW" "_forward"
bind "DOWNARROW" "_back"
bind "LEFTARROW" "_moveLeft"
bind "RIGHTARROW" "_moveRight"

bind "SPACE" "_moveUp"
bind "CTRL" "_moveDown"
bind "SHIFT" "_speed"
bind "e" "_frob"

// Keep mouse look active for the FPS greybox.
seta in_mouse "1"
