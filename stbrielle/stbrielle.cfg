// ST. BRIELLE development configuration
set developer "1"
set com_showFPS "0"
set si_pure "0"
set g_showHud "1"

set fs_copyfiles "0"

// Bootstrap UI: console font atlas is not installed yet.
set con_noPrint "1"

// Standalone greybox: disable inherited Skin Deep fullscreen/post effects.
set g_skipViewEffects "1"
set g_doubleVision "0"


// Core FPS movement
bind "w" "_forward"
bind "s" "_back"
bind "a" "_moveLeft"
bind "d" "_moveRight"
bind "SPACE" "_moveUp"
bind "CTRL" "_moveDown"
bind "SHIFT" "_speed"

// St. Brielle interaction
bind "e" "_frob"
