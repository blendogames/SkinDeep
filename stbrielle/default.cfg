// ST. BRIELLE: THE INTERVAL
// Native base configuration for the standalone development build.
//
// Keep this file present: idTech 4 uses default.cfg as a filesystem sanity
// check during startup before the rest of the game initialization runs.

seta sys_lang "english"
seta com_allowConsole "1"
seta r_fullscreen "0"
seta g_showHud "1"
seta si_pure "0"
seta fs_copyfiles "0"

// Project-only development defaults live here.
exec stbrielle.cfg
