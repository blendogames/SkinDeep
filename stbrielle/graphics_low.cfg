// Same material/lighting art direction with a lower rendering cost.
// Launch with: run_stbrielle_annex.bat low
set r_shadows "0"
set image_filter "GL_LINEAR_MIPMAP_LINEAR"
set image_anisotropy "4"
set image_downSize "1"
set image_downSizeLimit "256"
set image_downSizeBump "1"
set image_downSizeBumpLimit "256"
set image_downSizeSpecular "1"
set image_downSizeSpecularLimit "128"
